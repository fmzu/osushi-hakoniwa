name: ci

# main へのデプロイ（deploy.yml）と同じ check / test / build を PR でも走らせる
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup vp
        uses: voidzero-dev/setup-vp@v1
        with:
          run-install: false

      - name: Install deps
        run: vp install

      - name: Check (type + lint)
        run: vp check src/

      - name: Test
        run: vp test run

      - name: Build
        run: vp build
