<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>おすしのはこにわ</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1>おすしのはこにわ</h1>
    <div class="sub">おすしに あいさつして なかよくなろう ♡</div>
    <div class="frame">
      <canvas id="cv"></canvas>
      <div id="banner"></div>
    </div>
    <div class="bar">
      <span>おすし: <b id="count">0</b> かん</span>
      <button id="bell">🔔 よぶ</button>
      <button id="openWall">🎨 かべ</button>
      <button id="openZukan">ずかん <b id="zcnt"></b></button>
    </div>

    <div id="zukan">
      <div class="book">
        <h2>すしいもむし ずかん</h2>
        <div class="cnt" id="zcnt2"></div>
        <div class="cards" id="cards"></div>
        <div class="znav">
          <button id="zPrev">◀ まえ</button>
          <span class="pg" id="zPageNum"></span>
          <button id="zNext">つぎ ▶</button>
        </div>
        <button class="close" id="closeZukan">とじる</button>
      </div>
    </div>

    <div id="wallModal">
      <div class="book">
        <h2>かべの もよう</h2>
        <div class="swatches" id="swatches"></div>
        <button class="close" id="closeWall">とじる</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
