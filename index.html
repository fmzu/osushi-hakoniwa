<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>おすしのはこにわ</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#FFEFF3; --pink2:#FFD9E3; --brown:#8A5A48; --accent:#E06A3C;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'DotGothic16',monospace;
    background:var(--pink2);
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:16px 12px;
    -webkit-tap-highlight-color:transparent;
  }
  h1{color:var(--brown);font-size:22px;letter-spacing:2px;margin:4px 0 2px}
  .sub{color:#C98A96;font-size:12px;margin-bottom:10px}
  .frame{
    background:var(--pink);
    border:4px solid #fff;
    border-radius:12px;
    box-shadow:0 4px 0 #E9B7C4;
    padding:6px;
    width:100%;max-width:480px;
  }
  canvas{
    display:block;width:100%;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    border-radius:6px;
    touch-action:manipulation;
  }
  .counter{color:var(--brown);font-size:13px;margin-top:10px}
  .counter b{color:var(--accent)}
</style>
</head>
<body>
<h1>おすしのはこにわ</h1>
<div class="sub">タップすると おすしが ふえるよ ♡</div>
<div class="frame"><canvas id="cv"></canvas></div>
<div class="counter">おすしのみんな: <b id="count">0</b> かん</div>

<script>
// ---- スプライトデータ(イモムシ2フレーム) ----
const RICE = { R:'#FFFDF6', D:'#EFDFC8', d:'#E0CFB2' };
const NETA = {
  salmon: { S:'#FF8C5F', L:'#FFC9A1', H:'#FFE6D2', E:'#E06A3C' },
  maguro: { S:'#E64A5E', L:'#F2858F', H:'#FAB4BB', E:'#B83648' },
  tamago: { S:'#FFD24A', L:'#FFE285', H:'#FFF2BC', E:'#E8A23E', band:'#414F44' }
};
const STRETCH = [
"................","................","................","...EEEEEEEEEE...",
"..ESHSLSSSLSSE..",".ESHSLSSSLSSSLE.",".ESSLSSSLSSSLSE.",".ESRRRRDRRRRRSE.",
".ESRRRRRRRRRRSE.","..dDRRRRRRRRDd..","..dDRRDRRRRRDd..","..dDRRRRRDRRDd..",
"...dddddddddd...","................","................","................"];
const SCRUNCH = [
"................","................",".....EEEEEEEE...","....EHSLSSLSSE..",
"...EHSLSSLSSLSE.","...ESLSSLSSLSSE.","...ESSLSSLSSLSE.","...ESRRRDRRRRSE.",
"...ESRRRRRRRRSE.","....dDRRRRRRDd..","....dDRDRRRRDd..","....dDRRRRDRDd..",
".....dddddddd...","................","................","................"];

function bake(grid, flip, pal, bandCols){
  const c = document.createElement('canvas');
  c.width = 16; c.height = 16;
  const x2 = c.getContext('2d');
  grid.forEach((row, y) => {
    [...row].forEach((ch, x) => {
      if (ch === '.') return;
      x2.fillStyle = (bandCols && bandCols.includes(x)) ? pal.band : pal[ch];
      x2.fillRect(flip ? 15 - x : x, y, 1, 1);
    });
  });
  return c;
}
// SPR[ネタ][向き][フレーム]  dir: 1=右向き, -1=左向き
const SPR = {};
for (const [name, neta] of Object.entries(NETA)){
  const pal = { ...RICE, ...neta };
  const bandS = neta.band ? [7,8] : null;   // 伸びの帯位置(中央2列)
  const bandC = neta.band ? [8,9] : null;   // 縮みは前端固定で中央がずれる
  SPR[name] = {
    '1':  [bake(STRETCH,false,pal,bandS), bake(SCRUNCH,false,pal,bandC)],
    '-1': [bake(STRETCH,true,pal,bandS),  bake(SCRUNCH,true,pal,bandC)]
  };
}
// 右向きスプライトは前端=右。SCRUNCHは元データが右端固定で描いてあるので
// 左向きのときはフレーム間で前端(左)が固定されるよう反転で自動的に成立する。

// ---- ワールド ----
const W = 160, H = 144;          // ゲームボーイ解像度の箱庭
const GROUND_TOP = 28;           // ここから下が床
const cv = document.getElementById('cv');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const STEP_MS = 190;             // 1フレームの長さ(尺取りテンポ)
const sushis = [];
const hearts = [];

function spawn(x, y){
  const kinds = Object.keys(NETA);
  sushis.push({
    kind: kinds[Math.floor(Math.random()*kinds.length)],
    x: Math.max(2, Math.min(W-18, x ?? Math.random()*(W-20))),
    y: Math.max(GROUND_TOP, Math.min(H-18, y ?? GROUND_TOP+Math.random()*(H-GROUND_TOP-18))),
    dir: Math.random() < .5 ? 1 : -1,
    frame: Math.random() < .5 ? 0 : 1,   // 同期して気持ち悪くならないようバラす
    timer: Math.random()*STEP_MS,
    pause: 0
  });
  document.getElementById('count').textContent = sushis.length;
}

function tick(dt){
  for (const s of sushis){
    if (s.pause > 0){ s.pause -= dt; continue; }
    s.timer += dt;
    if (s.timer < STEP_MS) continue;
    s.timer -= STEP_MS;
    s.frame = 1 - s.frame;
    if (s.frame === 0){                  // 縮み→伸び: 頭が前に出る瞬間に前進
      s.x += 2 * s.dir;
      if (Math.random() < .35) s.y += (Math.random() < .5 ? 1 : -1); // 奥行きドリフト
      s.y = Math.max(GROUND_TOP, Math.min(H-18, s.y));
      if (s.x < 2 || s.x > W-18){ s.dir *= -1; s.x = Math.max(2, Math.min(W-18, s.x)); }
      else if (Math.random() < .04) s.dir *= -1;        // 気まぐれUターン
      if (Math.random() < .03) s.pause = 800 + Math.random()*1500;  // ひとやすみ
      if (Math.random() < .015) hearts.push({x:s.x+8, y:s.y-2, life:1});
    }
  }
  for (let i = hearts.length-1; i >= 0; i--){
    hearts[i].y -= dt * .008;
    hearts[i].life -= dt / 1200;
    if (hearts[i].life <= 0) hearts.splice(i,1);
  }
}

// ピクセルハート(5x5)
function drawHeart(x, y, a){
  ctx.globalAlpha = a;
  ctx.fillStyle = '#F783A1';
  const px = [[1,0],[3,0],[0,1],[1,1],[2,1],[3,1],[4,1],[1,2],[2,2],[3,2],[2,3]];
  for (const [dx,dy] of px) ctx.fillRect(Math.round(x)+dx-2, Math.round(y)+dy-2, 1, 1);
  ctx.globalAlpha = 1;
}

function draw(){
  // 背景: パステルピンク + ドット柄
  ctx.fillStyle = '#FFF4F7';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#FFE3EA';
  for (let y = 4; y < H; y += 12)
    for (let x = (y/12 % 2 ? 10 : 4); x < W; x += 12)
      ctx.fillRect(x, y, 1, 1);
  // 床のライン
  ctx.fillStyle = '#FBD9E2';
  ctx.fillRect(0, GROUND_TOP-2, W, 1);

  // yソートして奥のコから描く
  const sorted = [...sushis].sort((a,b) => a.y - b.y);
  for (const s of sorted){
    ctx.drawImage(SPR[s.kind][String(s.dir)][s.pause > 0 ? 0 : s.frame], Math.round(s.x), Math.round(s.y));
  }
  for (const h of hearts) drawHeart(h.x, h.y, Math.max(0, h.life));
}

let last = performance.now();
function loop(now){
  tick(Math.min(now - last, 100));
  last = now;
  draw();
  requestAnimationFrame(loop);
}

cv.addEventListener('pointerdown', e => {
  if (sushis.length >= 14) return;       // 満員
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W - 8;
  const y = (e.clientY - r.top) / r.height * H - 8;
  spawn(x, Math.max(GROUND_TOP, y));
});

spawn(); spawn(); spawn();
requestAnimationFrame(loop);
</script>
</body>
</html>
