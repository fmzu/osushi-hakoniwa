<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>おすしのはこにわ</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'DotGothic16',monospace;
    background:#FFD9E3;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:16px 12px;
    -webkit-tap-highlight-color:transparent;
  }
  h1{color:#8A5A48;font-size:22px;letter-spacing:2px;margin:4px 0 2px}
  .sub{color:#C98A96;font-size:12px;margin-bottom:10px}
  .frame{
    position:relative;
    background:#FFEFF3;border:4px solid #fff;border-radius:12px;
    box-shadow:0 4px 0 #E9B7C4;padding:6px;width:100%;max-width:480px;
  }
  canvas#cv{
    display:block;width:100%;
    image-rendering:pixelated;image-rendering:crisp-edges;
    border-radius:6px;touch-action:manipulation;
  }
  #banner{
    position:absolute;left:50%;top:14px;transform:translateX(-50%) scale(0);
    background:#fff;color:#E06A3C;border:2px solid #FFC9A1;border-radius:10px;
    padding:6px 14px;font-size:14px;white-space:nowrap;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1);
    pointer-events:none;
  }
  #banner.show{transform:translateX(-50%) scale(1)}
  .bar{
    display:flex;gap:10px;align-items:center;margin-top:10px;
    color:#8A5A48;font-size:13px;
  }
  .bar b{color:#E06A3C}
  button{
    font-family:inherit;font-size:13px;color:#8A5A48;
    background:#fff;border:2px solid #E9B7C4;border-radius:10px;
    padding:6px 14px;box-shadow:0 2px 0 #E9B7C4;cursor:pointer;
  }
  button:active{transform:translateY(2px);box-shadow:none}
  #zukan{
    position:fixed;inset:0;background:rgba(138,90,72,.35);
    display:none;align-items:center;justify-content:center;padding:16px;z-index:10;
  }
  #zukan.open{display:flex}
  .book{
    background:#FFF7F9;border:4px solid #fff;border-radius:16px;
    box-shadow:0 6px 0 #E9B7C4;padding:16px;width:100%;max-width:420px;
    max-height:84vh;overflow-y:auto;
  }
  .book h2{color:#8A5A48;font-size:18px;text-align:center;margin-bottom:2px}
  .book .cnt{color:#C98A96;font-size:12px;text-align:center;margin-bottom:12px}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .card{
    background:#fff;border:2px dashed #F2C9D4;border-radius:12px;
    padding:10px 6px;text-align:center;
  }
  .card img{width:64px;height:64px;image-rendering:pixelated}
  .card .nm{color:#8A5A48;font-size:14px;margin-top:2px}
  .card .sk{color:#E06A3C;font-size:12px}
  .card.unknown .nm,.card.unknown .sk{color:#D9A8B5}
  .close{display:block;margin:14px auto 0}
</style>
</head>
<body>
<h1>おすしのはこにわ</h1>
<div class="sub">おすしを タップして はっけんしよう ♡</div>
<div class="frame">
  <canvas id="cv"></canvas>
  <div id="banner"></div>
</div>
<div class="bar">
  <span>おすし: <b id="count">0</b> かん</span>
  <button id="openZukan">ずかん <b id="zcnt"></b></button>
</div>

<div id="zukan">
  <div class="book">
    <h2>すしいもむし ずかん</h2>
    <div class="cnt" id="zcnt2"></div>
    <div class="cards" id="cards"></div>
    <button class="close" id="closeZukan">とじる</button>
  </div>
</div>

<script>
// ============ 形状グリッド ============
const NIGIRI = {
  stretch: [
"................","................","................","...EEEEEEEEEE...",
"..ESHSLSSSLSSE..",".ESHSLSSSLSSSLE.",".ESSLSSSLSSSLSE.",".ESRRRRDRRRRRSE.",
".ESRRRRRRRRRRSE.","..dDRRRRRRRRDd..","..dDRRDRRRRRDd..","..dDRRRRRDRRDd..",
"...dddddddddd...","................","................","................"],
  scrunch: [
"................","................",".....EEEEEEEE...","....EHSLSSLSSE..",
"...EHSLSSLSSLSE.","...ESLSSLSSLSSE.","...ESSLSSLSSLSE.","...ESRRRDRRRRSE.",
"...ESRRRRRRRRSE.","....dDRRRRRRDd..","....dDRDRRRRDd..","....dDRRRRDRDd..",
".....dddddddd...","................","................","................"],
  band: { stretch:[7,8], scrunch:[8,9] }
};
const GUNKAN = {
  stretch: [
"................","................","................","................",
"...P..P..P..P...","..OOOOOOOOOOOO..",".NQOQQOQQOQQOQN.",".NNNNNNNNNNNNNN.",
".NNnNNNNNNNNNNN.",".NNNNNNNnNNNNNN.",".NNNNNNNNNNNnNN.",".NNNNNNNNNNNNNN.",
"..NNNNNNNNNNNN..","................","................","................"],
  scrunch: [
"................","................","................",".....P..P..P....",
"...NOOOOOOOOON..","...NOOOOOOOOON..","...NQOQQOQQOQN..","...NNNNNNNNNNNN.",
"...NNnNNNNNNNNN.","...NNNNNNNNnNNN.","...NNNNNNNNNNNN.","...NNNNNNNNNNNN.",
"....NNNNNNNNNN..","................","................","................"]
};
const RICE = { R:'#FFFDF6', D:'#EFDFC8', d:'#E0CFB2' };

// ============ 住人図鑑(マスターデータ) ============
// せいかくは挙動パラメータに直結:
//   step=歩くテンポms / pauseP=ひとやすみ率 / pauseLen=休憩長 /
//   heartP=♡率 / flipP=Uターン率 / driftP=奥行きふらふら率 / weight=出現しやすさ
const SPECIES = [
 { id:'salmon', name:'サーモン', seikaku:'のんびりや', shape:NIGIRI,
   pal:{S:'#FF8C5F',L:'#FFC9A1',H:'#FFE6D2',E:'#E06A3C'},
   step:240, pauseP:.06, pauseLen:[1500,3500], heartP:.012, flipP:.03, driftP:.35, weight:3 },
 { id:'maguro', name:'まぐろ', seikaku:'せっかち', shape:NIGIRI,
   pal:{S:'#E64A5E',L:'#F2858F',H:'#FAB4BB',E:'#B83648'},
   step:135, pauseP:0, pauseLen:[0,0], heartP:.01, flipP:.02, driftP:.35, weight:3 },
 { id:'tamago', name:'たまご', seikaku:'あまえんぼ', shape:NIGIRI,
   pal:{S:'#FFD24A',L:'#FFE285',H:'#FFF2BC',E:'#E8A23E',band:'#414F44'},
   step:190, pauseP:.03, pauseLen:[800,2300], heartP:.07, flipP:.03, driftP:.35, weight:3 },
 { id:'ebi', name:'えび', seikaku:'はずかしがりや', shape:NIGIRI,
   pal:{S:'#FFF0E8',L:'#FF8662',H:'#FFFAF6',E:'#EE9476'},
   step:190, pauseP:.03, pauseLen:[800,2300], heartP:.01, flipP:.14, driftP:.35, weight:2 },
 { id:'ika', name:'いか', seikaku:'ねぼすけ', shape:NIGIRI,
   pal:{S:'#F3F2F7',L:'#FFFFFF',H:'#FFFFFF',E:'#CFCBDC'},
   step:210, pauseP:.06, pauseLen:[2500,6000], heartP:.01, flipP:.03, driftP:.35, weight:2 },
 { id:'ikura', name:'いくら', seikaku:'こうきしんおうせい', shape:GUNKAN,
   pal:{N:'#414F44',n:'#5E6E60',O:'#FF7436',P:'#FFC18E',Q:'#E0522A'},
   step:170, pauseP:.02, pauseLen:[800,2300], heartP:.015, flipP:.08, driftP:.8, weight:1 },
];

// ============ スプライトベイク ============
function bake(grid, flip, pal, bandCols){
  const c = document.createElement('canvas');
  c.width = 16; c.height = 16;
  const g = c.getContext('2d');
  grid.forEach((row, y) => {
    [...row].forEach((ch, x) => {
      if (ch === '.') return;
      g.fillStyle = (bandCols && bandCols.includes(x)) ? pal.band : pal[ch];
      g.fillRect(flip ? 15 - x : x, y, 1, 1);
    });
  });
  return c;
}
function silhouette(src){
  const c = document.createElement('canvas');
  c.width = 16; c.height = 16;
  const g = c.getContext('2d');
  g.drawImage(src, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = '#E5BFCA';
  g.fillRect(0, 0, 16, 16);
  return c;
}
for (const sp of SPECIES){
  const pal = { ...RICE, ...sp.pal };
  const bS = sp.pal.band ? sp.shape.band.stretch : null;
  const bC = sp.pal.band ? sp.shape.band.scrunch : null;
  sp.spr = {
    '1':  [bake(sp.shape.stretch,false,pal,bS), bake(sp.shape.scrunch,false,pal,bC)],
    '-1': [bake(sp.shape.stretch,true,pal,bS),  bake(sp.shape.scrunch,true,pal,bC)]
  };
  sp.shadow = silhouette(sp.spr['1'][0]);
}

// ============ 保存(リポジトリ運用前提でlocalStorage / 失敗時はメモリのみ) ============
const store = {
  load(){ try { return new Set(JSON.parse(localStorage.getItem('osushi-zukan')||'[]')); } catch(e){ return new Set(); } },
  save(s){ try { localStorage.setItem('osushi-zukan', JSON.stringify([...s])); } catch(e){} }
};
const discovered = store.load();

// ============ ワールド ============
const W = 160, H = 144, GROUND_TOP = 28;
const cv = document.getElementById('cv');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const sushis = [], hearts = [];

function pickSpecies(){
  const total = SPECIES.reduce((a,s)=>a+s.weight,0);
  let r = Math.random()*total;
  for (const s of SPECIES){ r -= s.weight; if (r<0) return s; }
  return SPECIES[0];
}
function spawn(x, y, sp){
  sp = sp || pickSpecies();
  sushis.push({
    sp,
    x: Math.max(2, Math.min(W-18, x ?? Math.random()*(W-20))),
    y: Math.max(GROUND_TOP, Math.min(H-18, y ?? GROUND_TOP+Math.random()*(H-GROUND_TOP-18))),
    dir: Math.random()<.5 ? 1 : -1,
    frame: Math.random()<.5 ? 0 : 1,
    timer: Math.random()*sp.step,
    pause: 0
  });
  document.getElementById('count').textContent = sushis.length;
}

function tick(dt){
  for (const s of sushis){
    const p = s.sp;
    if (s.pause > 0){ s.pause -= dt; continue; }
    s.timer += dt;
    if (s.timer < p.step) continue;
    s.timer -= p.step;
    s.frame = 1 - s.frame;
    if (s.frame === 0){
      s.x += 2*s.dir;
      if (Math.random() < p.driftP) s.y += (Math.random()<.5 ? 1 : -1);
      s.y = Math.max(GROUND_TOP, Math.min(H-18, s.y));
      if (s.x < 2 || s.x > W-18){ s.dir*=-1; s.x = Math.max(2, Math.min(W-18, s.x)); }
      else if (Math.random() < p.flipP) s.dir *= -1;
      if (Math.random() < p.pauseP) s.pause = p.pauseLen[0] + Math.random()*(p.pauseLen[1]-p.pauseLen[0]);
      if (Math.random() < p.heartP) hearts.push({x:s.x+8, y:s.y-2, life:1});
    }
  }
  for (let i=hearts.length-1; i>=0; i--){
    hearts[i].y -= dt*.008;
    hearts[i].life -= dt/1200;
    if (hearts[i].life <= 0) hearts.splice(i,1);
  }
}

function drawHeart(x, y, a){
  ctx.globalAlpha = a;
  ctx.fillStyle = '#F783A1';
  const px = [[1,0],[3,0],[0,1],[1,1],[2,1],[3,1],[4,1],[1,2],[2,2],[3,2],[2,3]];
  for (const [dx,dy] of px) ctx.fillRect(Math.round(x)+dx-2, Math.round(y)+dy-2, 1, 1);
  ctx.globalAlpha = 1;
}
function draw(){
  ctx.fillStyle = '#FFF4F7'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#FFE3EA';
  for (let y=4; y<H; y+=12)
    for (let x=(y/12%2?10:4); x<W; x+=12) ctx.fillRect(x,y,1,1);
  ctx.fillStyle = '#FBD9E2'; ctx.fillRect(0, GROUND_TOP-2, W, 1);
  const sorted = [...sushis].sort((a,b)=>a.y-b.y);
  for (const s of sorted){
    ctx.drawImage(s.sp.spr[String(s.dir)][s.pause>0 ? 0 : s.frame], Math.round(s.x), Math.round(s.y));
  }
  for (const h of hearts) drawHeart(h.x, h.y, Math.max(0,h.life));
}

let last = performance.now();
(function loop(now){
  tick(Math.min((now||last)-last, 100));
  last = now||last;
  draw();
  requestAnimationFrame(loop);
})(last);

// 住人は時間でもふらっと増える
setInterval(()=>{ if (sushis.length < 10) spawn(); }, 8000);
spawn(); spawn(); spawn();

// ============ はっけん ============
const banner = document.getElementById('banner');
let bannerTimer = null;
function showBanner(text){
  banner.textContent = text;
  banner.classList.add('show');
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(()=>banner.classList.remove('show'), 1800);
}
function discover(s){
  discovered.add(s.sp.id);
  store.save(discovered);
  showBanner('はっけん！ ' + s.sp.name);
  for (let i=0;i<5;i++) hearts.push({x:s.x+4+Math.random()*8, y:s.y-2-Math.random()*4, life:1});
  updateZukanCount();
}

cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect();
  const px = (e.clientX-r.left)/r.width*W, py = (e.clientY-r.top)/r.height*H;
  // 手前のコから当たり判定
  const sorted = [...sushis].sort((a,b)=>b.y-a.y);
  for (const s of sorted){
    if (px>=s.x && px<s.x+16 && py>=s.y && py<s.y+16){
      if (!discovered.has(s.sp.id)) discover(s);
      else hearts.push({x:s.x+8, y:s.y-2, life:1});
      return;
    }
  }
  if (sushis.length < 12 && py > GROUND_TOP) spawn(px-8, py-8);
});

// ============ ずかん ============
const zukan = document.getElementById('zukan');
const cards = document.getElementById('cards');
function updateZukanCount(){
  const t = `${discovered.size}/${SPECIES.length}`;
  document.getElementById('zcnt').textContent = t;
  document.getElementById('zcnt2').textContent = 'はっけん ' + t + ' かん';
}
function renderZukan(){
  cards.innerHTML = '';
  for (const sp of SPECIES){
    const known = discovered.has(sp.id);
    const card = document.createElement('div');
    card.className = 'card' + (known ? '' : ' unknown');
    const img = document.createElement('img');
    img.src = (known ? sp.spr['1'][0] : sp.shadow).toDataURL();
    const nm = document.createElement('div'); nm.className='nm';
    nm.textContent = known ? sp.name : '？？？';
    const sk = document.createElement('div'); sk.className='sk';
    sk.textContent = known ? 'せいかく: ' + sp.seikaku : '…だれだろう';
    card.append(img, nm, sk);
    cards.append(card);
  }
}
document.getElementById('openZukan').onclick = ()=>{ renderZukan(); zukan.classList.add('open'); };
document.getElementById('closeZukan').onclick = ()=>zukan.classList.remove('open');
zukan.addEventListener('pointerdown', e=>{ if (e.target===zukan) zukan.classList.remove('open'); });
updateZukanCount();
</script>
</body>
</html>
